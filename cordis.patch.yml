# dsh-code-review: independent P0-P3 code review of the session's changed files.
# config (all optional):
#   provider: spawn            # fresh in-process subagent; providers that inherit context are rejected
#   allowShell: false          # true also lets the reviewer use pwsh/bash (shells can modify files)
#   model: <id>                # reviewer model override (modelProvider / reasoningEffort also optional)
#   timeoutMs: 1800000
#   maxDiffChars: 80000
- insert:
    - id: dsh-code-review
      name: 'dsh-code-review'
      config:
        provider: spawn
